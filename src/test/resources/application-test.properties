# Profil "test" : base H2 en mémoire (mode PostgreSQL), aucune base externe requise (Jenkins).
spring.datasource.url=jdbc:h2:mem:smartcampus;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.locations=classpath:db/migration
smartcampus.auth.jwt-secret=test-secret-0123456789-0123456789-abcdef
