server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartcampus}
spring.datasource.username=${DB_USER:smartcampus}
spring.datasource.password=${DB_PASSWORD:smartcampus_pwd}

# --- Migrations (Flyway) ---------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Authentification ------------------------------------------
# JWT_SECRET est obligatoire (au moins 32 caractères).
smartcampus.auth.jwt-secret=${JWT_SECRET:}
smartcampus.auth.jwt-expiration=${JWT_EXPIRATION:1h}
smartcampus.auth.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
smartcampus.auth.lock-duration=${AUTH_LOCK_DURATION:15m}

# Les utilisateurs viennent de la table users, pas de l'utilisateur
# généré par défaut par Spring Security.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
